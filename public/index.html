<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yuva Blood Forum by YUVADEEPTI SMYM ARCHEPARCHY OF CHANGANASSERY</title>
  <meta name="description" content="Yuva Blood Forum by YUVADEEPTI SMYM ARCHEPARCHY OF CHANGANASSERY. Fast, accessible public blood donor search portal. Powered by ÉclatTech Technologies.">
  <meta name="theme-color" content="#fffdf8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ybf-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="Yuva Blood Forum logo" class="logo-img" width="48" height="48">
        <div class="brand-text">
          <h1 class="brand-title">Yuva Blood Forum</h1>
          <span class="brand-subtitle"><strong>YUVADEEPTI SMYM ARCHEPARCHY OF CHANGANASSERY</strong></span>
        </div>
      </a>

      <div class="nav-actions">
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
          </svg>
        </button>
        <a href="profile.html" class="btn btn-outline btn-sm btn-nav-icon" aria-label="Donor Profile">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Profile</span>
        </a>
        <a href="admin.html" class="btn btn-outline btn-sm btn-nav-icon" aria-label="Admin Portal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Admin</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <div class="hero-banner">
        <img src="images/logo.png" alt="" class="hero-logo" width="120" height="120">
        <p class="hero-eyebrow">Donor Directory</p>
        <h2 class="hero-title">Yuva Blood Forum</h2>
        <p class="hero-desc"><strong>YUVADEEPTI SMYM ARCHEPARCHY OF CHANGANASSERY</strong></p>
      </div>

      <section class="search-card card">
        <div class="search-bar-wrapper">
          <div class="search-input-box">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search by name, phone, area, or keyword..." autocomplete="off">
            <button id="clearSearchBtn" class="btn-clear hidden" title="Clear Search">&times;</button>
          </div>
          <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>

        <div id="filterControlsContainer" class="filters-grid"></div>

        <div class="filter-actions hidden" id="filterActions">
          <button class="btn-text" onclick="app.resetFilters()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset All Filters
          </button>
        </div>
      </section>

      <section class="results-header">
        <div class="results-info">
          <span class="results-count" id="resultsCount">Loading records...</span>
          <span class="dataset-meta" id="datasetMeta"></span>
        </div>
        <div class="records-per-page">
          <label for="limitSelect">Show:</label>
          <select id="limitSelect" onchange="app.changeLimit(this.value)">
            <option value="12" selected>12 per page</option>
            <option value="24">24 per page</option>
            <option value="48">48 per page</option>
          </select>
        </div>
      </section>

      <section id="resultsContainer" class="results-grid"></section>

      <nav id="paginationContainer" class="pagination-wrapper hidden">
        <button id="prevPageBtn" class="btn btn-outline btn-sm" onclick="app.changePage(-1)">
          &larr; Previous
        </button>
        <span id="pageIndicator" class="page-indicator">Page 1 of 1</span>
        <button id="nextPageBtn" class="btn btn-outline btn-sm" onclick="app.changePage(1)">
          Next &rarr;
        </button>
      </nav>

    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Yuva Blood Forum by YUVADEEPTI SMYM ARCHEPARCHY OF CHANGANASSERY</p>
      <p class="footer-credit">Powered by <span class="brand-accent">ÉclatTech Technologies</span></p>
    </div>
  </footer>

  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
